[project]
name = "onboarding-python-fastapi"
version = "0.1.0"
description = "A site with its own login and orangecheck behind it: Connect, claiming at ochk.app, and sign in with orangecheck. FastAPI, server-rendered."
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=43",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "orangecheck>=3.7,<4",
    "python-multipart>=0.0.18",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
