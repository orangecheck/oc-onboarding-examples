{% extends "base.html" %}
{% block title %}Confirm your password{% endblock %}
{% block main %}
<h1>Confirm your password</h1>
<p class="lead">Linking, unlinking and deleting ask for your own password first.</p>
<form class="card stack" method="post" action="/reauth">
  <input type="hidden" name="next" value="{{ next }}" />
  <label>
    Password <input name="password" type="password" autocomplete="current-password" required />
  </label>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <button type="submit">Confirm</button>
</form>
{% endblock %}
