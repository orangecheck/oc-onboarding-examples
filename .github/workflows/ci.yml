name: CI

# Every example, offline, against the stand-ins in its own folder. No secrets.

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    hygiene:
        # A path into someone's home directory names a person in a public repo
        # and works on one machine only.
        name: No absolute home-directory paths
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
            # Every commit in the history, scanned for secrets.
            - name: No secrets in the history (gitleaks 8.30.1, pinned by sha256)
              run: |
                  curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
                  echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
                  tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
                  "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --log-level warn
            - run: |
                  if git grep -nIE '(^|[^A-Za-z0-9_.:/-])/(Users|home)/[A-Za-z0-9_.-]+/' -- . ':!*.lock' ':!package-lock.json'; then
                      echo "::error::absolute home-directory path in a tracked file"
                      exit 1
                  fi

    node-next:
        name: node-next (Node ${{ matrix.node }})
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node: ['22', '24']
        defaults:
            run:
                working-directory: node-next
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm
                  cache-dependency-path: node-next/package-lock.json
            - run: npm ci
            - run: npm run type-check
            - run: npm run lint
            - run: npm run format:check
            - run: npm test
            - run: npm run build

    python-fastapi:
        name: python-fastapi (Python ${{ matrix.python }})
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python: ['3.10', '3.13']
        defaults:
            run:
                working-directory: python-fastapi
        steps:
            - uses: actions/checkout@v5
            - uses: astral-sh/setup-uv@v6
              with:
                  python-version: ${{ matrix.python }}
                  enable-cache: true
                  cache-dependency-glob: python-fastapi/uv.lock
            - run: uv sync --locked
            - run: uv run ruff check
            - run: uv run ruff format --check
            - run: uv run pytest

    guardian:
        name: guardian (script checks)
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: guardian
        steps:
            - uses: actions/checkout@v5
            - run: bash -n local-federation.sh
            - run: shellcheck local-federation.sh
            - run: python3 -m py_compile bundle_wrapper.py esplora_stand_in.py

    merge-renovate:
        name: Merge family bump
        needs: [hygiene, node-next, python-fastapi, guardian]
        if: github.event_name == 'pull_request' && github.head_ref == 'renovate/@orangecheck-(family)'
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - name: Rebase-merge the PR
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh pr merge ${{ github.event.pull_request.number }} --rebase --repo ${{ github.repository }}
